server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The app lives under /tubify/ (like https://nici753.github.io/tubify/)
    location = / {
        return 302 /tubify/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Same as GitHub Pages: unknown paths get 404.html, which is the SPA shell,
    # so react-router can handle routes like /tubify/callback on a direct load.
    error_page 404 /tubify/404.html;
}